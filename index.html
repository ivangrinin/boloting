<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Батьковское болото</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Mono:wght@400;700&display=swap">
<style>
  :root{
    --page-bg:#d9cdac;
    --paper:#f2ead6;
    --panel:#ede1c3;
    --ink:#2e2a20;
    --ink-soft:#6b5f49;
    --ink-faint:#8d7f62;
    --forest:#4e6b45;
    --accent:#a1451f;
    --shadow:rgba(43,38,27,0.38);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page-bg:#131109;
      --paper:#211c14;
      --panel:#251f15;
      --ink:#ecdfc0;
      --ink-soft:#b9ab88;
      --ink-faint:#8d8065;
      --forest:#6f9463;
      --accent:#e08a52;
      --shadow:rgba(0,0,0,0.65);
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#131109;
    --paper:#211c14;
    --panel:#251f15;
    --ink:#ecdfc0;
    --ink-soft:#b9ab88;
    --ink-faint:#8d8065;
    --forest:#6f9463;
    --accent:#e08a52;
    --shadow:rgba(0,0,0,0.65);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--ink);
    font-family:'PT Sans', Arial, sans-serif;
    display:flex;
    justify-content:center;
    padding:56px 18px 64px;
  }
  .page{max-width:760px; width:100%; text-align:center;}

  .eyebrow{
    font-family:'PT Mono', monospace;
    text-transform:uppercase;
    letter-spacing:.16em;
    font-size:12px;
    color:var(--accent);
    margin:0 0 16px;
  }
  h1{
    font-family:'Yeseva One', 'PT Sans', serif;
    font-weight:400;
    font-size:clamp(34px,6.4vw,62px);
    line-height:1.08;
    margin:0 0 18px;
    color:var(--ink);
    text-wrap:balance;
  }
  .subtitle{
    font-size:17px;
    font-style:italic;
    color:var(--ink-soft);
    margin:0 0 36px;
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
  }

  .photo-frame{
    background:var(--paper);
    border-radius:10px;
    padding:14px;
    box-shadow:0 18px 40px var(--shadow);
    margin:0 0 30px;
  }
  .photo-frame img{
    display:block;
    width:100%;
    height:auto;
    border-radius:5px;
  }
  .photo-caption{
    font-family:'PT Mono', monospace;
    font-size:12px;
    color:var(--ink-faint);
    margin:14px 2px 0;
    text-align:left;
  }

  footer{
    margin-top:36px;
    padding-top:18px;
    border-top:1px solid var(--ink-faint);
    font-family:'PT Mono', monospace;
    font-size:11.5px;
    color:var(--ink-faint);
    letter-spacing:.04em;
  }
</style>
</head>
